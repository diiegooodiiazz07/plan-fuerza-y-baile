<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Tu Plan Fuerza y Baile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: guía de consulta para la clienta — cabecera fija, dos vistas (#comidas con platos ilustrados, #ejercicios con figuras animadas), barra inferior en móvil y pestañas arriba en escritorio. */
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --surface-2:#EDE9F1; --ink:#1C1722; --muted:#655D6E; --line:#DED8E4;
  --berry:#A3195B; --berry-ink:#FFFFFF; --berry-soft:#F7DCE8;
  --teal:#0E6E6A; --teal-soft:#D5EEEB; --bad:#B3261E; --good:#2C7A4B; --good-soft:#DCF0E2;
  --fig:#2A2431; --fig-far:#B9B1C2; --equip:#9C94A6; --equip-soft:#D9D3DF; --focus:#E0457F;
  --plate:#FFFFFF; --plate-rim:#E4DEE9; --dish:#EAD8C2; --dish-s:#D2BB9F;
  --f-pasta:#E9B949; --f-pasta-s:#C38E25; --f-tomato:#D2442F; --f-rice:#FBF7EE; --f-rice-s:#CFC5B2;
  --f-chicken:#E2B07A; --f-grill:#9A6233; --f-beef:#8E4A33; --f-pork:#D9977A; --f-potato:#EFC15A;
  --f-sweet:#E8823A; --f-sweet2:#F4B072; --f-green:#4F9D4A; --f-green2:#7DBF5C; --f-lentil:#8A5A3B;
  --f-chickpea:#E3C58E; --f-chickpea-s:#C4A36A; --f-carrot:#EE8A2E; --f-ham:#E68FA0; --f-curry:#E3A72F;
  --f-cheese:#FBE7A1; --f-tortilla:#EBCB8B; --f-crust:#B97A3F; --f-crumb:#EFD3A2; --f-soup:#E79A3C;
  --f-yogurt:#FBFAF6; --f-orange:#F29A2E; --f-kiwi:#8FBF3C; --f-kiwi-s:#7A5A35; --f-banana:#F4CF4A;
  --f-pear:#C9D35A; --f-coffee:#7A4E2D; --f-froth:#D9B48C; --f-mush:#BFA58A; --f-pepper:#D9442F;
  --f-cucumber:#D4EAAE; --f-turkey:#F2B8B0; --f-queso:#F7E3A0; --f-jamon:#B8323F; --f-thigh:#C98B4E;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(28,23,34,.06),0 4px 16px rgba(28,23,34,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121015; --surface:#1B1820; --surface-2:#25212B; --ink:#F1EDF4; --muted:#A79FB0; --line:#332D3A;
  --berry:#F0629F; --berry-ink:#1A0A12; --berry-soft:#3B1829; --teal:#4FC2B8; --teal-soft:#13302D; --bad:#F2766D; --good:#63C78B; --good-soft:#15301F;
  --fig:#EDE7F2; --fig-far:#5D5566; --equip:#7D7488; --equip-soft:#3A3441; --focus:#F0629F;
  --plate:#2B2631; --plate-rim:#3B3542; --dish:#4A3B2F; --dish-s:#5E4B3B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121015; --surface:#1B1820; --surface-2:#25212B; --ink:#F1EDF4; --muted:#A79FB0; --line:#332D3A;
  --berry:#F0629F; --berry-ink:#1A0A12; --berry-soft:#3B1829; --teal:#4FC2B8; --teal-soft:#13302D; --bad:#F2766D; --good:#63C78B; --good-soft:#15301F;
  --fig:#EDE7F2; --fig-far:#5D5566; --equip:#7D7488; --equip-soft:#3A3441; --focus:#F0629F;
  --plate:#2B2631; --plate-rim:#3B3542; --dish:#4A3B2F; --dish-s:#5E4B3B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-stretch:118%;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:1.2rem;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.shell{max-width:980px;margin:0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:12px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--berry);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.sub{font-size:.8rem;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);max-width:980px;margin:0 auto}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--berry)}
main{padding-block:20px 110px}
@media (min-width:760px){
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);padding-bottom:0;z-index:19}
  .nav-in{display:flex;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav a{flex-direction:row;gap:8px;font-size:.95rem;padding:10px 14px;border-bottom:2px solid transparent}
  .nav a svg{width:18px;height:18px}
  .nav a[aria-current="page"]{border-bottom-color:var(--berry)}
  main{padding-block:28px 60px}
}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.lead{color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.baile{background:var(--berry-soft);color:var(--berry)}
.pill.gym{background:var(--teal-soft);color:var(--teal)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Día */
.dayhead{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.dayhead h2{font-size:clamp(1.6rem,6vw,2.2rem);font-stretch:125%;font-weight:900}
.dayhead .pill{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.dayhead .pill.baile{background:var(--berry);color:var(--berry-ink)}
.dayhead .pill.gym{background:var(--teal);color:var(--ink)}
.kcal-big{display:flex;flex-direction:column;align-items:flex-end}
.kcal-big b{font-family:var(--display);font-stretch:112%;font-size:1.6rem;font-weight:900;line-height:1}
.kcal-big span{font-size:.75rem;opacity:.75}
.timeline{display:flex;flex-direction:column;gap:14px}
.act{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.92rem}
.act.baile{background:var(--berry-soft);color:var(--berry)}
.act.gym{background:var(--teal-soft);color:var(--teal)}
.act time{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px}
.meal{display:grid;grid-template-columns:1fr;gap:0;overflow:hidden;padding:0}
.meal .art{background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:10px}
.meal .art svg{width:100%;max-width:320px;height:auto;display:block}
.meal .txt{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meal .when{display:flex;gap:8px;align-items:baseline}
.meal .when time{font-weight:800;font-variant-numeric:tabular-nums;color:var(--berry)}
.meal ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.meal .kc{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:640px){.meal{grid-template-columns:260px minmax(0,1fr)}.meal .art{padding:14px}}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--muted)}
details.more[open] summary::before{content:"− "}
details.more[open]{display:flex;flex-direction:column;gap:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* Ejercicios */
.session{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.session .eyebrow{color:inherit;opacity:.75}
.phase{border-radius:var(--r);padding:14px 16px;background:var(--teal-soft);color:var(--teal);font-size:.92rem}
.phase b{font-family:var(--display);font-stretch:115%}
.phase span{color:var(--ink)}
.ex{display:grid;grid-template-columns:1fr;gap:0;padding:0;overflow:hidden}
.ex .stage{background:var(--surface-2);position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 12px 10px;gap:6px}
.ex .stage svg{width:100%;max-width:360px;height:auto;display:block}
.ex .ph{font-size:.82rem;font-weight:700;color:var(--muted);min-height:1.3em;text-align:center}
.ex .poses{display:flex;gap:6px}
.ex .body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex-n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none;font-family:var(--display)}
@media (min-width:760px){.ex{grid-template-columns:340px minmax(0,1fr)}.ex .stage{justify-content:center}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--berry-soft);color:var(--berry)}
.mchip.soft{background:var(--surface-2);color:var(--muted)}
.presc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.presc div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.presc b{font-family:var(--display);font-stretch:110%;font-size:1.05rem;font-variant-numeric:tabular-nums}
.presc span{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.presc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feel{font-size:.93rem;border-left:3px solid var(--focus);padding-left:10px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
ul.errs{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
ul.errs li::marker{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--focus);opacity:.45;vertical-align:-2px;margin-right:5px}
@page{size:A4;margin:11mm}
body.printing{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13.5px;background:#FFFFFF}
body.printing .top,body.printing .nav{display:none}
body.printing main{padding-block:0;max-width:none}
.print{display:flex;flex-direction:column}
.ppage{break-before:page;display:flex;flex-direction:column;gap:10px}
.ppage.cover{break-before:auto;gap:22px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.phead .row{gap:6px}
.pback{font-size:.8rem;text-decoration:none;color:var(--berry);font-weight:700;margin-left:6px}
.pmeal{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;break-inside:avoid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pmeal .art{background:var(--surface-2);display:flex;align-items:center;padding:6px}
.pmeal .art svg{width:100%;height:auto}
.pmeal .txt{padding:10px 12px 10px 0;display:flex;flex-direction:column;gap:3px}
.pmeal .when{display:flex;gap:8px;align-items:baseline}.pmeal time{font-weight:800;color:var(--berry)}
.pmeal ul{margin:0;padding-left:1.1em;font-size:.9rem}
.pmeal .kc{font-size:.78rem;color:var(--muted)}
.pex{break-inside:avoid;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.pfigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pfigs figure{margin:0;background:var(--surface-2);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pfigs svg{width:100%;height:auto;max-height:140px}
.pfigs figcaption{font-size:.75rem;font-weight:700;color:var(--muted)}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcols ol,.pcols ul{font-size:.86rem}
.cover-band{background:var(--ink);color:var(--bg);border-radius:16px;padding:44px 30px;display:flex;flex-direction:column;gap:12px}
.ctitle{font-size:3.2rem;font-stretch:125%;font-weight:900;line-height:.95;font-family:var(--display)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.toc{display:flex;flex-direction:column;gap:7px;padding-left:1.2em;margin:10px 0}
.toc a{color:var(--ink);font-weight:600}
.print a{color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="shell gutter top-in">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--berry-ink)" stroke-width="2.4" stroke-linecap="round"><path d="M4 9v6M8 6v12M16 6v12M20 9v6M8 12h8"/></svg></div>
    <div style="min-width:0"><h1>Tu Plan Fuerza y Baile</h1><div class="sub" id="sub"></div></div>
  </div>
</header>
<nav class="nav" aria-label="Secciones">
  <div class="nav-in" id="nav">
    <a href="#comidas" data-v="comidas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18a9 9 0 0 1-18 0zM12 3v3M8 5l1 2M16 5l-1 2"/></svg>Comidas</a>
    <a href="#ejercicios" data-v="ejercicios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg>Ejercicios</a>
  </div>
</nav>
<main class="shell gutter" id="main"></main>

<script>
/* ============ DATOS: comidas y ejercicios (mismo plan que el del entrenador) ============ */
const TOP = {
  pavo:"4 lonchas de pavo (50 g) + 1 cucharadita de aceite (5 g)",
  queso:"2 lonchas de queso tierno (40 g), sin aceite",
  jamon:"3 lonchas de jamón serrano (30 g) + 1 cucharadita de aceite (5 g)",
  mixto:"2 lonchas de pavo + 1 loncha de queso tierno",
  sandJQ:"Sándwich: 2 lonchas de jamón serrano + 1 loncha de queso tierno"
};
const desayuno = (top, time="7:30") => ({t:"meal", id:"desayuno", time, title:"Desayuno", sum:"Café con leche + 2 tostadas integrales",
  items:["Café con 1 taza de leche semidesnatada sin lactosa (200 ml)","2 tostadas o 1 sándwich de pan integral (~70 g)", top], kcal:"≈ 360 kcal · 24 g proteína"});
/* 4.ª comida opcional: se activa desde la app cuando 3 comidas resulten fáciles */
const EXTRA_KCAL = 230;
const MEAL4 = (time, title) => ({t:"meal", id:"merienda", time, title, extra:true, sum:"Leche + proteína en polvo",
  items:["250 ml de leche sin lactosa","1 cacito de proteína en polvo (30 g)","Batidora o vaso mezclador, 30 segundos"], kcal:"≈ 230 kcal · 32 g proteína"});
const slot4 = (time="18:00", title="Merienda · batido") => ({t:"slot4", time, title});

const DAYS = [
 {key:"lun", name:"Lunes", tags:["baile","gym"], label:"Baile 19:00 + Gimnasio A 20:30", kcal:1950, water:12, gym:"A", load:"Alta",
  tip:"Comes a las 15:00 y llegas al baile con la comida bien asentada. En el gimnasio salta el calentamiento general: vienes caliente del baile.",
  agenda:[desayuno(TOP.pavo),
   {t:"meal", id:"almuerzo", time:"15:00", title:"Pasta con pollo y tomate", sum:"Pasta, pollo, tomate y espinacas",
    items:["100 g de pasta cruda (2 puños y medio cocida)","150 g de pechuga de pollo (1 palma grande)","½ vaso de tomate triturado","1 puñado de espinacas","1 cucharada de aceite (10 g)","30 g de pan","Postre: 1 naranja"], kcal:"≈ 800 kcal · 50 g proteína"},
   slot4(),
   {t:"act", kind:"baile", time:"19:00", title:"Baile · coreografía", sum:"1 hora · bebe 500 ml durante"},
   {t:"act", kind:"gym", time:"20:30", title:"Gimnasio · Día A", sum:"Fuerza de glúteo e isquios · 75 min", link:"#gym"},
   {t:"meal", id:"cena", time:"22:15", title:"Fajitas de lomo", sum:"2 tortillas, lomo, pimiento y mozzarella",
    items:["2 tortillas de trigo","150 g de lomo en tiras (1 palma grande)","½ pimiento + ½ cebolla a la plancha","1 puñado de mozzarella rallada (40 g)","1 cucharadita de aceite (5 g)","Postre: 1 yogur griego (125 g)"], kcal:"≈ 850 kcal · 50 g proteína"}]},
 {key:"mar", name:"Martes", tags:["descanso"], label:"Descanso", kcal:1950, water:8, load:"Baja",
  tip:"Día de recuperación. Un paseo de 20–30 minutos es opcional y ayuda si estás todo el día sentada.",
  agenda:[desayuno(TOP.queso),
   {t:"meal", id:"almuerzo", time:"15:00", title:"Lentejas con verduras", sum:"Lentejas de bote, patata y jamón",
    items:["1 bote de lentejas cocidas (~250 g escurridas)","1 patata pequeña (100 g) en dados","Zanahoria, pimiento y cebolla","40 g de jamón serrano en taquitos","1 cucharada de aceite (10 g)","60 g de pan","Postre: 2 mandarinas"], kcal:"≈ 820 kcal · 42 g proteína"},
   slot4(),
   {t:"act", kind:"rest", time:"—", title:"Descanso activo", sum:"Paseo opcional de 20–30 min"},
   {t:"meal", id:"cena", time:"21:30", title:"Pollo con patatas en freidora de aire", sum:"Pechuga, patata, ensalada y yogur",

const PLAN_START = new Date(2026, 10, 16);
const pad = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const dayIdx = d => (d.getDay()+6)%7;
const fmt = (n, dec=1) => n.toLocaleString("es-ES",{maximumFractionDigits:dec});
function planWeek(){ return Math.floor(Math.round((today() - PLAN_START)/86400000)/7) + 1; }
function phaseOf(w){
  if (w < 1) return {mode:"adapt", name:"Antes de empezar", text:"El plan empieza el lunes 16 de noviembre. Las dos primeras semanas son de adaptación."};
  if (w <= 2) return {mode:"adapt", name:"Adaptación", text:"2 series por ejercicio, dejando 3–4 repeticiones en reserva. Aprende la técnica."};
  if (w <= 6) return {mode:"prog", name:"Progresión", text:"Series completas y el RIR indicado. Sube peso cuando completes el rango."};
  if (w === 7) return {mode:"deload", name:"Descarga", text:"Mitad de series, mismo peso, RIR 4."};
  if (w <= 11) return {mode:"prog2", name:"Progresión 2", text:"+1 serie en hip thrust y abducción si te recuperas bien."};
  if (w === 12) return {mode:"review", name:"Revisión", text:"Semana suave: una serie menos, RIR 3."};
  return {mode:"prog", name:"Nuevo bloque", text:"Sigue las indicaciones de tu entrenador para el siguiente bloque."};
}
function setsFor(ex, mode){
  if (mode === "adapt") return Math.min(ex.sets, 2);
  if (mode === "deload") return Math.ceil(ex.sets/2);
  if (mode === "review") return Math.max(1, ex.sets-1);
  if (mode === "prog2" && ex.plus) return ex.sets + 1;
  return ex.sets;
}
function rirFor(ex, mode){
  if (ex.eq === "core") return "—";
  return ({adapt:"3–4", deload:"4", review:"3"})[mode] || ex.rir;
}

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const N = x => x.toFixed(1);
function scatter(n, cx, cy, R, rnd, f){ let s = ""; for (let i = 0; i < n; i++){ const a = rnd()*6.2832, d = Math.sqrt(rnd())*R; s += f(cx + Math.cos(a)*d, cy + Math.sin(a)*d, Math.round(rnd()*180), i); } return s; }

function breakfastScene(m){
  const txt = m.items.join(" ").toLowerCase();
  if (txt.includes("sándwich: 2 lonchas de jamón")) return [["coffee",44,74,28],["plate",146,75,60],["sandwichJQ",146,75]];
  const top = txt.includes("pavo") && txt.includes("queso") ? "mixto" : txt.includes("pavo") ? "pavo" : txt.includes("jamón") ? "jamon" : "queso";
  return [["coffee",44,74,28],["plate",146,75,60],["toast",128,64,top],["toast",164,88,top]];
}
function dishSVG(dayKey, m, label){
  const ops = m.id === "desayuno" ? breakfastScene(m) : (SCENES[`${dayKey}/${m.id}`] || [["plate",110,75,60]]);
  let seed = 0; for (const c of dayKey + m.id) seed = (seed*31 + c.charCodeAt(0)) | 0;
  const R = rng(seed);
  const body = ops.map(([k, ...a]) => FOOD[k] ? FOOD[k](...a, R) : "").join("");
  return `<svg viewBox="0 0 220 150" role="img" aria-label="${label}">${body}</svg>`;
}

const SIDE = [["shoulder","hip",10],["hip","knee",8.5],["knee","ankle",7],["ankle","toe",5],["shoulder","elbow",6.5],["elbow","hand",6],["shoulder","head",6]];
const FRONT = [["neck","hip",11],["sL","sR",7],["sL","eL",6.5],["eL","hL",6],["sR","eR",6.5],["eR","hR",6],["hipL","hipR",8],["hipL","kL",8.5],["kL","aL",7],["hipR","kR",8.5],["kR","aR",7],["aL","fL",5],["aR","fR",5],["neck","head",6]];
const lerp = (p,q,t) => [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
function poseAt(F, t){
  const o = {}, c = F.c || {};
  new Set([...Object.keys(c), ...Object.keys(F.a), ...Object.keys(F.b)]).forEach(k => {
    const a = F.a[k] || c[k], b = F.b[k] || c[k]; o[k] = lerp(a, b, t);
  });
  if (F.view === "side" && !o.toe && o.ankle) o.toe = [o.ankle[0]+9, o.ankle[1]];
  if (F.view === "front") { o.fL = [o.aL[0]-7, o.aL[1]]; o.fR = [o.aR[0]+7, o.aR[1]]; }
  return o;
}
function pt(P, spec){
  if (Array.isArray(spec)) { const p = pt(P, spec[0]); return [p[0]+spec[1], p[1]+spec[2]]; }
  if (spec.includes(">")) { const [a,b] = spec.split(">"); return lerp(P[a], P[b], .5); }
  return P[spec];
}
function seg(P, a, b, w, col){ if (!P[a] || !P[b]) return ""; return `<line x1="${N(P[a][0])}" y1="${N(P[a][1])}" x2="${N(P[b][0])}" y2="${N(P[b][1])}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; }
function drawFig(F, P){
  let s = `<line x1="4" y1="151" x2="236" y2="151" stroke="var(--equip-soft)" stroke-width="2"/>`;
  F.props.forEach(p => {
    if (p.k === "rect") s += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="3" fill="var(--equip)"/>`;
    else if (p.k === "line") s += `<line x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}" stroke="var(--equip)" stroke-width="${p.w}" stroke-linecap="round"/>`;
    else if (p.k === "dot") s += `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="var(--equip)"/>`;
    else if (p.k === "cable") { const h = P[p.at]; s += `<circle cx="${p.from[0]}" cy="${p.from[1]}" r="5" fill="var(--equip)"/><line x1="${p.from[0]}" y1="${p.from[1]}" x2="${N(h[0])}" y2="${N(h[1])}" stroke="var(--equip)" stroke-width="1.6"/>`; }
  });
  (F.focus || []).forEach(f => { const q = pt(P, f); s += `<circle cx="${N(q[0])}" cy="${N(q[1])}" r="13" fill="var(--focus)" opacity=".28"/><circle cx="${N(q[0])}" cy="${N(q[1])}" r="7" fill="var(--focus)" opacity=".35"/>`; });
  if (F.view === "side") {
    s += seg(P,"shoulder","e2",6,"var(--fig-far)") + seg(P,"e2","h2",5.5,"var(--fig-far)") + seg(P,"hip","k2",7.5,"var(--fig-far)") + seg(P,"k2","a2",6.5,"var(--fig-far)");
    SIDE.forEach(([a,b,w]) => s += seg(P,a,b,w,"var(--fig)"));
  } else FRONT.forEach(([a,b,w]) => s += seg(P,a,b,w,"var(--fig)"));
  s += `<circle cx="${N(P.head[0])}" cy="${N(P.head[1])}" r="9" fill="var(--fig)"/>`;
  F.props.forEach(p => {
    const h = p.at ? P[p.at] : null; if (!h) return;
    const x = h[0] + (p.dx || 0), y = h[1] + (p.dy || 0);
    if (p.k === "plate") s += `<circle cx="${N(x)}" cy="${N(y)}" r="${p.r}" fill="var(--equip)" stroke="var(--fig)" stroke-width="1.5"/><circle cx="${N(x)}" cy="${N(y)}" r="3" fill="var(--fig)"/>`;
    else if (p.k === "pad") s += `<circle cx="${N(x)}" cy="${N(y)}" r="${p.r}" fill="var(--equip)" stroke="var(--fig)" stroke-width="1"/>`;
    else if (p.k === "db") s += `<rect x="${N(x-2)}" y="${N(y-8)}" width="4" height="16" fill="var(--fig)"/><rect x="${N(x-5)}" y="${N(y-11)}" width="10" height="6" rx="2" fill="var(--equip)" stroke="var(--fig)" stroke-width="1"/><rect x="${N(x-5)}" y="${N(y+5)}" width="10" height="6" rx="2" fill="var(--equip)" stroke="var(--fig)" stroke-width="1"/>`;
    else if (p.k === "kb") s += `<path d="M${N(x-5)} ${N(y-2)}a5 5 0 0 1 10 0" stroke="var(--fig)" stroke-width="2.5" fill="none"/><circle cx="${N(x)}" cy="${N(y+7)}" r="9" fill="var(--equip)" stroke="var(--fig)" stroke-width="1.5"/>`;

}
function figSVG(id, t){ const F = POSES[id]; return `<svg class="fig" data-ex="${id}" viewBox="0 0 240 160" role="img" aria-label="Movimiento: ${F.labels[0]} → ${F.labels[1]}">${drawFig(F, poseAt(F, t))}</svg>`; }

/* Animación: subida 0,9 s, pausa, bajada lenta 1,3 s (excéntrica), pausa */
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ANIM = { on: !reduceMotion, t0: performance.now(), raf: 0, still: {} };
const ease = x => .5 - Math.cos(Math.PI * x)/2;
function cycle(p){ if (p < .12) return 0; if (p < .38) return ease((p-.12)/.26); if (p < .52) return 1; if (p < .9) return 1 - ease((p-.52)/.38); return 0; }
function tick(now){
  if (!ANIM.on) { ANIM.raf = 0; return; }
  const t = cycle(((now - ANIM.t0)/3600) % 1);
  document.querySelectorAll("svg.fig").forEach(svg => {
    const F = POSES[svg.dataset.ex]; if (!F) return;
    const r = svg.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    svg.innerHTML = drawFig(F, poseAt(F, t));
    const lab = document.getElementById("ph-" + svg.dataset.ex), txt = F.labels[t < .5 ? 0 : 1];
    if (lab && lab.textContent !== txt) lab.textContent = txt;
  });
  ANIM.raf = requestAnimationFrame(tick);
}
function startAnim(){ if (!ANIM.raf && ANIM.on) ANIM.raf = requestAnimationFrame(tick); }

  else if (a === "ses") { UI.ses = t.dataset.s; render(); }
  else if (a === "anim") { ANIM.on = !ANIM.on; if (ANIM.on) ANIM.t0 = performance.now(); render(); }
  else if (a === "still") { ANIM.still[t.dataset.id] = Number(t.dataset.t); render(); }
});
window.addEventListener("hashchange", () => { if (window.__PRINT) return; render(); window.scrollTo(0,0); });

/* ============ VERSIÓN PDF (#imprimir) ============ */
function printView(){
  const back = `<a class="pback" href="#indice">↑ Índice</a>`;
  const dayPages = DAYS.map(d => {
    const ag = agendaOf(d);
    return `<section class="ppage" id="dia-${d.key}">
      <div class="phead"><div><div class="eyebrow">Menú</div><h2>${d.name}</h2></div><div class="row">${d.tags.map(t => `<span class="pill ${t}">${t === "baile" ? "Baile" : t === "gym" ? "Gimnasio "+d.gym : "Descanso"}</span>`).join("")}<span class="pill num">≈ ${fmt(d.kcal,0)} kcal</span>${back}</div></div>
      <p class="small muted">${d.tip}</p>
      ${ag.map(a => a.t === "act" ? (a.kind === "rest" ? "" : `<div class="act ${a.kind}"><time>${a.time}</time><span><b>${a.title}</b> · ${a.sum}</span></div>`)
        : `<div class="pmeal"><div class="art">${dishSVG(d.key, a, a.title)}</div><div class="txt"><div class="when"><time>${a.time}</time><span class="eyebrow">${MEAL_LABEL[a.id] || ""}</span></div><h3>${a.title}</h3><ul>${a.items.map(i => `<li>${i}</li>`).join("")}</ul><span class="kc">${a.kcal}</span></div></div>`).join("")}
    </section>`;
  }).join("");
  const exPages = ["A","B"].map(g => `<section class="ppage" id="dia-${g}">
      <div class="phead"><div><div class="eyebrow">Entrenamiento</div><h2>${g === "A" ? "Día A · lunes 20:30" : "Día B · viernes 10:00"}</h2></div>${back}</div>
      <div class="session"><h3>${g === "A" ? "Fuerza de glúteo e isquios" : "Glúteo medio, espalda y core"}</h3><p class="small">${g === "A" ? "Vienes del baile: salta el calentamiento general y haz 1–2 series ligeras de aproximación en los primeros ejercicios." : "Calentamiento: 5 min de bici + 15 puentes de glúteo con banda. Intensidad algo menor porque por la tarde bailas 2 h 30 min."}</p></div>
      ${EX[g].map((ex, i) => { const F = POSES[ex.id]; return `<article class="pex">
        <div class="pfigs"><figure>${figSVG(ex.id, 0)}<figcaption>1 · ${F.labels[0]}</figcaption></figure><figure>${figSVG(ex.id, 1)}<figcaption>2 · ${F.labels[1]}</figcaption></figure></div>
        <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="ex-n">${i+1}</div><div class="stack" style="gap:6px;min-width:0"><h3>${ex.name}</h3><div class="chips">${chipsOf(ex)}</div></div></div>
        <div class="presc"><div><span>Series</span><b>${ex.sets}</b></div><div><span>${ex.secs ? "Tiempo" : "Reps"}</span><b>${ex.repsTxt || ex.reps[0]+"–"+ex.reps[1]}</b></div><div><span>Descanso</span><b>${ex.restTxt}</b></div><div><span>RIR</span><b>${ex.eq === "core" ? "—" : ex.rir}</b></div></div>
        <p class="small"><b>Ritmo:</b> ${ex.tempo}</p>
        <p class="feel"><b>Dónde lo tienes que notar:</b> ${ex.feel}</p>
        <div class="pcols"><div><b class="small">Técnica</b><ol class="steps">${ex.tech.map(t => `<li>${t}</li>`).join("")}</ol></div>
        <div><b class="small">Errores comunes</b><ul class="errs">${ex.errors.map(t => `<li>${t}</li>`).join("")}</ul><p class="small" style="margin-top:8px"><b>Si la máquina está ocupada:</b> ${ex.alt}</p></div></div>
      </article>`; }).join("")}
    </section>`).join("");
  return `<div class="print">
    <section class="ppage cover" id="indice">
      <div class="cover-band"><div class="eyebrow" style="color:inherit;opacity:.8">Plan de nutrición y entrenamiento · 12 semanas</div><h1 class="ctitle">Tu Plan<br>Fuerza y Baile</h1><p>Del 16 de noviembre de 2026 al 7 de febrero de 2027</p></div>
      <div class="pgrid">
        <div><h3>Índice</h3><ol class="toc">
          <li><a href="#semana">Tu semana</a></li>
          ${DAYS.map(d => `<li><a href="#dia-${d.key}">Menú del ${d.name.toLowerCase()}</a></li>`).join("")}
          <li><a href="#dia-A">Entrenamiento · Día A</a></li>
          <li><a href="#dia-B">Entrenamiento · Día B</a></li>
          <li><a href="#progresar">Cómo progresar</a></li>
        </ol><p class="small muted">Toca cualquier apartado para ir directo. En cada página, «↑ Índice» te devuelve aquí.</p></div>
        <div><h3>Lo esencial</h3><ul class="errs" style="list-style:disc">
          <li>3 comidas al día: unas 1.950 kcal (2.150 el viernes).</li>
          <li>Proteína en cada comida: carne, pavo, jamón o yogur griego.</li>
          <li>Agua: 2 L los días de descanso, hasta 3,5 L el viernes.</li>
          <li>Gimnasio lunes 20:30 (Día A) y viernes 10:00 (Día B).</li>
          <li>Duerme 8 h, sobre todo la noche del lunes y la del viernes.</li>
        </ul></div>
      </div>
    </section>
    <section class="ppage" id="semana">
      <div class="phead"><div><div class="eyebrow">Organización</div><h2>Tu semana</h2></div>${back}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Día</th><th>Actividad</th><th>Kcal</th><th>Agua</th></tr></thead><tbody>
        ${DAYS.map(d => `<tr><td><a href="#dia-${d.key}"><b>${d.name}</b></a></td><td>${d.label}</td><td class="num">≈ ${fmt(d.kcal,0)}</td><td class="num">${fmt(d.water*0.25,2)} L</td></tr>`).join("")}
      </tbody></table></div>
      <h3 style="margin-top:18px">Medidas caseras</h3>
      <div class="tbl-wrap"><table><tbody>
        <tr><td>1 palma de tu mano de carne cruda</td><td>110–130 g</td></tr><tr><td>1 palma grande</td><td>~150 g</td></tr>
        <tr><td>1 puño de arroz o pasta cocidos</td><td>~120 g cocido (≈ 40 g crudo)</td></tr><tr><td>1 cucharada sopera de aceite</td><td>10 g</td></tr>
        <tr><td>1 cucharadita de aceite</td><td>5 g</td></tr><tr><td>1 patata grande</td><td>~250 g</td></tr>
      </tbody></table></div>
      <h3 style="margin-top:18px">Si quieres cambiar algo</h3>
      <div class="tbl-wrap"><table><tbody>
        <tr><td><b>Proteína</b></td><td>Pollo ↔ pavo, lomo, filete de ternera o contramuslo sin piel, en la misma cantidad.</td></tr>
        <tr><td><b>Hidratos</b></td><td>100 g de arroz o pasta ↔ 375 g de patata o boniato ↔ 150 g de pan.</td></tr>
        <tr><td><b>Fruta</b></td><td>Cualquiera menos manzana: naranja, 2 mandarinas, 2 kiwis, pera, plátano o fresas.</td></tr>
        <tr><td><b>Postre lácteo</b></td><td>Yogur griego ↔ 200 ml de leche ↔ 2 lonchas de queso tierno.</td></tr>
        <tr><td><b>Sin tiempo</b></td><td>Pollo asado + 2 vasitos de arroz de microondas · bote de legumbre salteado con jamón · wrap de pollo asado.</td></tr>
      </tbody></table></div>
    </section>
    ${dayPages}
    ${exPages}
    <section class="ppage" id="progresar">
      <div class="phead"><div><div class="eyebrow">Progresión</div><h2>Cómo progresar</h2></div>${back}</div>
      <p>Cada ejercicio tiene un rango de repeticiones. Cuando hagas <b>todas las series en lo alto del rango</b> con buena técnica, sube un poco el peso la siguiente sesión: barra +2,5–5 kg, mancuernas +1–2 kg, máquina una placa. Vuelves a la parte baja del rango.</p>
      <p style="margin-top:8px"><b>RIR</b> = repeticiones que te quedan en reserva al terminar la serie. RIR 2 = podrías hacer 2 más.</p>
      <h3 style="margin-top:18px">Las 12 semanas</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Semanas</th><th>Fechas</th><th>Cómo entrenar</th></tr></thead><tbody>
        <tr><td>1–2</td><td>16 nov – 29 nov</td><td><b>Adaptación:</b> 2 series por ejercicio, RIR 3–4. Aprende la técnica.</td></tr>
        <tr><td>3–6</td><td>30 nov – 27 dic</td><td><b>Progresión:</b> las series de cada ficha y el RIR indicado.</td></tr>
        <tr><td>7</td><td>28 dic – 3 ene</td><td><b>Descarga:</b> mitad de series, mismo peso, RIR 4.</td></tr>
        <tr><td>8–11</td><td>4 ene – 31 ene</td><td><b>Progresión 2:</b> +1 serie en hip thrust y abducción si te recuperas bien.</td></tr>
        <tr><td>12</td><td>1 feb – 7 feb</td><td><b>Revisión:</b> una serie menos, RIR 3. Medidas y fotos finales.</td></tr>
      </tbody></table></div>
    </section>
  </div>`;
}

render();
</script>
